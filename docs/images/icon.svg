<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="BitLens">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#14161f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- masked secret behind the lens -->
  <g fill="#6b7089">
    <circle cx="13" cy="58" r="4.5"/>
    <circle cx="103" cy="58" r="4.5"/>
  </g>
  <!-- lens -->
  <circle cx="58" cy="58" r="31" fill="url(#glass)" stroke="#c4b5fd" stroke-width="8"/>
  <line x1="81" y1="81" x2="104" y2="104" stroke="#c4b5fd" stroke-width="13" stroke-linecap="round"/>
  <!-- revealed through the lens -->
  <g fill="#f5f3ff">
    <circle cx="45" cy="58" r="5"/>
    <circle cx="58" cy="58" r="5"/>
    <circle cx="71" cy="58" r="5"/>
  </g>
</svg>
